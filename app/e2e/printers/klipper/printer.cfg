# A printer on Klipper's Linux-process MCU with simulated GPIO lines (gpio-sim, gpiochip0).
# Nothing moves; Klipper plans and times everything as on a real printer. One step per
# full step keeps the step rate low enough for the host MCU.
[mcu]
serial: /tmp/klipper_host_mcu

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 10
max_z_accel: 100

[stepper_x]
step_pin: gpiochip0/gpio0
dir_pin: gpiochip0/gpio1
enable_pin: !gpiochip0/gpio2
microsteps: 1
rotation_distance: 40
endstop_pin: gpiochip0/gpio3
position_endstop: 0
position_max: 300

[stepper_y]
step_pin: gpiochip0/gpio4
dir_pin: gpiochip0/gpio5
enable_pin: !gpiochip0/gpio6
microsteps: 1
rotation_distance: 40
endstop_pin: gpiochip0/gpio7
position_endstop: 0
position_max: 300

[stepper_z]
step_pin: gpiochip0/gpio8
dir_pin: gpiochip0/gpio9
enable_pin: !gpiochip0/gpio10
microsteps: 1
rotation_distance: 8
endstop_pin: gpiochip0/gpio11
position_endstop: 0
position_max: 300

[extruder]
step_pin: gpiochip0/gpio12
dir_pin: gpiochip0/gpio13
enable_pin: !gpiochip0/gpio14
microsteps: 1
rotation_distance: 33.5
nozzle_diameter: 0.4
filament_diameter: 1.75
max_extrude_only_distance: 500
max_extrude_cross_section: 50
min_extrude_temp: 0
heater_pin: gpiochip0/gpio15
sensor_type: temperature_host
sensor_path: /home/printer/fake_temp
control: watermark
min_temp: 0
max_temp: 300

[heater_bed]
heater_pin: gpiochip0/gpio16
sensor_type: temperature_host
sensor_path: /home/printer/fake_temp
control: watermark
min_temp: 0
max_temp: 150

[force_move]
enable_force_move: True

[virtual_sdcard]
path: ~/printer_data/gcodes

[display_status]
[pause_resume]
[exclude_object]

# No endstops to hit: homing just sets the position.
[gcode_macro G28]
rename_existing: G28.1
gcode:
  SET_KINEMATIC_POSITION X=0 Y=0 Z=0

# The temperatures never change: don't heat, don't wait.
[gcode_macro M104]
rename_existing: M104.1
gcode:
  M117 M104 {rawparams}
[gcode_macro M109]
rename_existing: M109.1
gcode:
  M117 M109 {rawparams}
[gcode_macro M140]
rename_existing: M140.1
gcode:
  M117 M140 {rawparams}
[gcode_macro M190]
rename_existing: M190.1
gcode:
  M117 M190 {rawparams}

[gcode_macro PRINT_START]
gcode:
  G28

[gcode_macro PRINT_END]
gcode:
  M104 S0
