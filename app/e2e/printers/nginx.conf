# As on a Mainsail/Fluidd printer (their nginx config), plus the location from docs/SELF_HOST_PI.md.
upstream apiserver {
    server ds-klipper:7125;
}

server {
    listen 80;
    client_max_body_size 1024m;

    location /dolphin/ {
        alias /home/pi/dolphin-slicer/;
        # nginx's mime.types has no .mjs (the engine is a JavaScript module).
        types {
            text/html html;
            text/css css;
            application/javascript js mjs;
            application/wasm wasm;
            application/json json map;
            image/svg+xml svg;
        }
        gzip on;
        gzip_types application/javascript application/wasm application/json text/css image/svg+xml;
    }

    location ~ ^/(printer|api|access|machine|server)/ {
        proxy_pass http://apiserver$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Scheme $scheme;
    }
}
