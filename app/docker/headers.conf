# Cross-origin isolation enables the multithreaded engine where the page is a secure context
# (https:// through a reverse proxy, or http://localhost). Over plain http:// on the network the app
# uses the single-threaded engine.
add_header Cross-Origin-Opener-Policy same-origin always;
add_header Cross-Origin-Embedder-Policy require-corp always;
add_header X-Content-Type-Options nosniff always;
