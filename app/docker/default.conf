# DolphinSlicer in the Docker image: the app at /, its storage folder (the /data volume) at /storage/.
# SPDX-License-Identifier: AGPL-3.0-or-later
server {
    listen 80;
    root /usr/share/nginx/html;
    # nginx's mime.types has no .mjs (the engine is a JavaScript module). A types block replaces the
    # inherited ones, so the standard ones come along.
    include /etc/nginx/mime.types;
    types {
        application/javascript mjs;
    }
    gzip on;
    gzip_types application/javascript application/wasm application/json text/css image/svg+xml;
    include /etc/nginx/dolphin-headers.conf;

    # Content-addressed files (the name or folder holds a hash): they never change.
    location ~ ^/(assets|engine|profiles|calib)/ {
        include /etc/nginx/dolphin-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /storage/ {
        alias /data/;
        # Write files (WebDAV, built into nginx) and list folders as JSON.
        dav_methods PUT DELETE MKCOL;
        create_full_put_path on;
        autoindex on;
        autoindex_format json;
        client_max_body_size 1024m;  # large models
    }
}
