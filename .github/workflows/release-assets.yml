# The self-hosted builds of a release: dolphinslicer-pi.zip (the build to serve from a printer,
# docs/SELF_HOST_PI.md) on the GitHub release, and the Docker image
# ghcr.io/dolphinslicer/dolphinslicer (docs/SELF_HOST_DOCKER.md), for amd64 and arm64.
# Runs from release-please.yml when it makes a release; run it by hand to redo a release's builds.
name: release-assets
on:
  workflow_call:
    inputs:
      tag: { type: string, required: true }
  workflow_dispatch:
    inputs:
      tag: { description: 'The release tag, e.g. v0.2.0', type: string, required: true }

permissions:
  contents: write
  packages: write

jobs:
  engine:
    name: Engine
    uses: ./.github/workflows/build-engine.yml
    with: { ref: '${{ inputs.tag }}' }

  assets:
    name: Self-hosted builds
    needs: engine
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      TAG: ${{ inputs.tag }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/dolphinslicer
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ inputs.tag }}' }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - uses: actions/download-artifact@v4
        with: { name: engine-st, path: .work/engine-st }
      - uses: actions/download-artifact@v4
        with: { name: engine-mt, path: .work/engine-mt }
      - name: Fetch OrcaSlicer sources
        run: bash -c 'source engine/scripts/common.sh && fetch_orca'
      - name: Install
        working-directory: app
        run: npm ci
      - name: Build
        working-directory: app
        env:
          ENGINE_DIST_ST: ${{ github.workspace }}/.work/engine-st
          ENGINE_DIST_MT: ${{ github.workspace }}/.work/engine-mt
        run: |
          npm run build:pi
          npx vite build --base ./ --outDir dist-docker
      - name: Attach dolphinslicer-pi.zip to the release
        working-directory: app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .zip && rm -rf .zip/dolphin-slicer && cp -r dist-pi .zip/dolphin-slicer
          (cd .zip && zip -qr ../dolphinslicer-pi.zip dolphin-slicer)
          gh release upload "$TAG" dolphinslicer-pi.zip --clobber -R "$GITHUB_REPOSITORY"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Image tags
        id: tags
        run: echo "tags=$IMAGE:${TAG#v},$IMAGE:latest" | tr '[:upper:]' '[:lower:]' >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: app
          file: app/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=DolphinSlicer, self-hosted
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.version=${{ inputs.tag }}
