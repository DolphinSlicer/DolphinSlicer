# Release PRs from the conventional commits on main (release-please): merging one tags the
# version, writes CHANGELOG.md and makes the GitHub release, then builds its self-hosted builds
# (release-assets.yml).
name: release-please
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # A token of its own, so CI runs on the release PR (main requires it); PRs opened with
          # the workflow's token start no workflows.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

  assets:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/release-assets.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
