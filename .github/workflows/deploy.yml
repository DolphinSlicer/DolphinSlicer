# Deploys main to Cloudflare Pages (dolphinslicer.app), and each pull request from this repository
# to a preview (<branch>.dolphinslicer.pages.dev, linked in a PR comment). Pull requests from forks
# get no preview: their workflows have no secrets. The engines are cached by their sources:
# a commit that leaves engine/ alone reuses them, one that changes it builds them (cold: hours,
# with warm dependency and compiler caches: much less).
name: deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# main: one deploy at a time, in order (a newer push waits). A pull request: a newer push cancels
# its running preview.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('deploy-pr-{0}', github.event.pull_request.number) || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  engine:
    name: Engine (${{ matrix.variant }})
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    strategy:
      matrix:
        variant: [st, mt]
    env:
      DEPS_JOBS: 4
      ENGINE_JOBS: 4
    steps:
      - uses: actions/checkout@v4
      - name: Engine built from these sources
        id: dist
        uses: actions/cache@v4
        with:
          path: .work/build-engine-${{ matrix.variant }}/dist
          key: engine-dist-${{ matrix.variant }}-${{ hashFiles('engine/**', '!engine/test/**') }}
      - name: Free disk space
        if: steps.dist.outputs.cache-hit != 'true'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Cache WASM dependencies
        if: steps.dist.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: .work/deps-${{ matrix.variant }}
          key: deps-${{ matrix.variant }}-${{ hashFiles('engine/versions.env', 'engine/deps/**', 'engine/patches/deps/**', 'engine/docker/Dockerfile', 'engine/docker/*.patch') }}
      - name: Cache compiler output
        if: steps.dist.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: |
            .work/ccache
            .work/emcache
          key: ccache-${{ matrix.variant }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.variant }}-
      - name: Build dependencies
        if: steps.dist.outputs.cache-hit != 'true'
        run: |
          if [ ! -f .work/deps-${{ matrix.variant }}/include/boost/version.hpp ]; then
            engine/scripts/build-deps.sh ${{ matrix.variant }}
          fi
      - name: Build engine
        if: steps.dist.outputs.cache-hit != 'true'
        run: engine/scripts/build-engine.sh ${{ matrix.variant }} orca_engine
      - uses: actions/upload-artifact@v4
        with:
          name: engine-${{ matrix.variant }}
          path: .work/build-engine-${{ matrix.variant }}/dist/slicer-${{ matrix.variant }}.*
          retention-days: 1
          if-no-files-found: error

  deploy:
    name: Build and deploy
    needs: engine
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    env:
      PREVIEW: ${{ github.event_name == 'pull_request' }}
      BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}
      COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - uses: actions/download-artifact@v4
        with: { name: engine-st, path: .work/engine-st }
      - uses: actions/download-artifact@v4
        with: { name: engine-mt, path: .work/engine-mt }
      # Profiles, calibration models and translations come from the pinned OrcaSlicer checkout.
      - name: Fetch OrcaSlicer sources
        run: bash -c 'source engine/scripts/common.sh && fetch_orca'
      - name: Install
        working-directory: app
        run: npm ci
      - name: Build
        working-directory: app
        env:
          ENGINE_DIST_ST: ${{ github.workspace }}/.work/engine-st
          ENGINE_DIST_MT: ${{ github.workspace }}/.work/engine-mt
        run: npm run build
      - name: Deploy to Cloudflare Pages
        working-directory: app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx --yes wrangler@4.166.0 pages deploy dist --project-name dolphinslicer --branch "$BRANCH" \
            --commit-hash "$COMMIT" | tee ../deploy.log
      - name: Link the preview
        if: env.PREVIEW == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # The branch's own address, else this deployment's.
          url=$(grep -oE 'https://[a-z0-9-]+\.dolphinslicer\.pages\.dev' deploy.log | tail -1)
          body="Preview: $url (commit ${COMMIT:0:7}). Google Drive sign-in works only on dolphinslicer.app."
          gh pr comment "$PR" -R "$GITHUB_REPOSITORY" --edit-last --body "$body" 2>/dev/null ||
            gh pr comment "$PR" -R "$GITHUB_REPOSITORY" --body "$body"
      - name: Check the live site
        if: env.PREVIEW != 'true'
        working-directory: app
        run: |
          built=$(ls dist/assets | grep -E '^index-.*\.js$')
          for i in $(seq 1 12); do
            live=$(curl -fsS https://dolphinslicer.app/ | grep -oE 'index-[A-Za-z0-9_-]+\.js' | head -1) || true
            [ "$live" = "$built" ] && { echo "live: $live"; exit 0; }
            sleep 10
          done
          echo "live site serves ${live:-nothing}, built $built" >&2
          exit 1
