# Deploys main to Cloudflare Pages (dolphinslicer.app), and each pull request from this repository
# to a preview (<branch>.dolphinslicer.pages.dev, linked in a PR comment), and runs the end-to-end
# tests on the same engines. Pull requests from forks get neither: their workflows have no secrets.
# The engines come from build-engine.yml.
name: deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# main: one deploy at a time, in order (a newer push waits). A pull request: a newer push cancels
# its running preview.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('deploy-pr-{0}', github.event.pull_request.number) || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  engine:
    name: Engine
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/build-engine.yml

  deploy:
    name: Build and deploy
    needs: engine
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    env:
      PREVIEW: ${{ github.event_name == 'pull_request' }}
      BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}
      COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - uses: actions/download-artifact@v4
        with: { name: engine-st, path: .work/engine-st }
      - uses: actions/download-artifact@v4
        with: { name: engine-mt, path: .work/engine-mt }
      # Profiles, calibration models and translations come from the pinned OrcaSlicer checkout.
      - name: Fetch OrcaSlicer sources
        run: bash -c 'source engine/scripts/common.sh && fetch_orca'
      - name: Install
        working-directory: app
        run: npm ci
      - name: Build
        working-directory: app
        env:
          ENGINE_DIST_ST: ${{ github.workspace }}/.work/engine-st
          ENGINE_DIST_MT: ${{ github.workspace }}/.work/engine-mt
        run: npm run build
      - name: Deploy to Cloudflare Pages
        working-directory: app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx --yes wrangler@4.166.0 pages deploy dist --project-name dolphinslicer --branch "$BRANCH" \
            --commit-hash "$COMMIT" | tee ../deploy.log
      - name: Link the preview
        if: env.PREVIEW == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # The branch's own address, else this deployment's.
          url=$(grep -oE 'https://[a-z0-9-]+\.dolphinslicer\.pages\.dev' deploy.log | tail -1)
          body="Preview: $url (commit ${COMMIT:0:7})"
          gh pr comment "$PR" -R "$GITHUB_REPOSITORY" --edit-last --body "$body" 2>/dev/null ||
            gh pr comment "$PR" -R "$GITHUB_REPOSITORY" --body "$body"
      - name: Check the live site
        if: env.PREVIEW != 'true'
        working-directory: app
        run: |
          built=$(ls dist/assets | grep -E '^index-.*\.js$')
          for i in $(seq 1 12); do
            live=$(curl -fsS https://dolphinslicer.app/ | grep -oE 'index-[A-Za-z0-9_-]+\.js' | head -1) || true
            [ "$live" = "$built" ] && { echo "live: $live"; exit 0; }
            sleep 10
          done
          echo "live site serves ${live:-nothing}, built $built" >&2
          exit 1

  # End-to-end tests (app/e2e, Playwright) against the production build: Chrome multithreaded (mt)
  # and single-threaded (st), and Firefox, each in two shards side by side. The printer tests
  # (PRINTER_E2E) need Docker printers and stay local.
  e2e:
    name: e2e (${{ matrix.project }} ${{ matrix.shard }}/2)
    needs: engine
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        project: [mt, st, firefox-mt]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - uses: actions/download-artifact@v4
        with: { name: engine-st, path: .work/engine-st }
      - uses: actions/download-artifact@v4
        with: { name: engine-mt, path: .work/engine-mt }
      - name: Fetch OrcaSlicer sources
        run: bash -c 'source engine/scripts/common.sh && fetch_orca'
      - name: Install
        working-directory: app
        run: npm ci
      - name: Build
        working-directory: app
        env:
          ENGINE_DIST_ST: ${{ github.workspace }}/.work/engine-st
          ENGINE_DIST_MT: ${{ github.workspace }}/.work/engine-mt
        run: npm run build
      - name: Install the browser
        working-directory: app
        run: npx playwright install --with-deps ${{ matrix.project == 'firefox-mt' && 'firefox' || 'chrome' }}
      - name: Test
        working-directory: app
        run: npx playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }}/2 --reporter=list,html
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-report-${{ matrix.project }}-${{ matrix.shard }}
          path: |
            app/playwright-report
            app/test-results
          retention-days: 7
